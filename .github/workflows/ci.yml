name: EduBilling CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: edubilling
          POSTGRES_PASSWORD: edubilling_ci_password
          POSTGRES_DB: edubilling_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U edubilling -d edubilling_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Static syntax & bytecode verification
        run: python -m compileall -q app bot tests migrate.py seed.py

      - name: Verify SQLite migration, seed, backup & restore drill
        run: |
          python migrate.py
          python seed.py
          python migrate.py --backup
          python migrate.py --restore edu_billing.db.bak
          python migrate.py --verify
          rm -f edu_billing.db edu_billing.db.bak

      - name: Run test suite on SQLite
        run: python -m pytest -v

      - name: Verify migration and full test suite on PostgreSQL 16
        env:
          DATABASE_URL: postgresql+psycopg://edubilling:edubilling_ci_password@localhost:5432/edubilling_test
          TEST_DATABASE_URL: postgresql+psycopg://edubilling:edubilling_ci_password@localhost:5432/edubilling_test
        run: |
          python migrate.py --verify
          python -m pytest -v